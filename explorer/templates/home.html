<!-- templates/home.html -->

<!DOCTYPE html>
<html>
<head>
    <title>File Explorer</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            padding: 20px;
        }

        h1{
            text-align: center;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td{
            border: 1px solid #444;
            padding: 12px;
            text-align: left;
        }

        th{
            background-color: #222;
        }

        tr:nth-child(even){
            background-color: #1a1a1a;
        }

        tr:hover{
            background-color: #333;
        }
    </style>
</head>

<body>

    <h1>📁 Django File Explorer</h1>

    <table>

        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Size</th>
            <th>Last Modified</th>
        </tr>

        {% for item in items %}

        <tr>

            <td>{{ item.name }}</td>

            <td>
                {% if item.is_folder %}
                    Folder
                {% else %}
                    File
                {% endif %}
            </td>

            <td>{{ item.size }} Bytes</td>

            <td>{{ item.modified_time }}</td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
