<!DOCTYPE html>
<html>
<head>

    <title>File Explorer</title>

    <style>

        body{
            background: #111;
            color: white;
            font-family: Arial;
            padding: 20px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #444;
            padding: 10px;
        }

        th{
            background: #222;
        }

        tr:hover{
            background: #333;
        }

        a{
            color: cyan;
            text-decoration: none;
        }

    </style>

</head>

<body>

<h1>📁 Django File Explorer</h1>

<h3>{{ current_path }}</h3>

<table>

<tr>
    <th>Name</th>
    <th>Type</th>
    <th>Size</th>
</tr>

{% for item in items %}

<tr>

<td>

{% if item.is_folder %}

<a href="/explore/{{ item.path }}/">
    📁 {{ item.name }}
</a>

{% else %}

📄 {{ item.name }}

{% endif %}

</td>

<td>

{% if item.is_folder %}
Folder
{% else %}
File
{% endif %}

</td>

<td>{{ item.size }} Bytes</td>

</tr>

{% endfor %}

</table>

</body>
</html>
