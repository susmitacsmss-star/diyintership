<!DOCTYPE html>
<html>
<head>
    <title>File Explorer</title>
</head>
<body>

<h1>File Explorer</h1>

<h3>Current Path: {{ current_path }}</h3>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Size (Bytes)</th>
        <th>Modified Time</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>

        <td>
            {% if item.is_folder %}
                Folder
            {% else %}
                File
            {% endif %}
        </td>

        <td>{{ item.size }}</td>

        <td>{{ item.modified_time }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
